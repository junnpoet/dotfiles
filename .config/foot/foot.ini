[main]
# Decouple foot colors from Omarchy's active theme; see [colors-dark] below.
# include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=10
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
foreground=000000
background=FFFFFF
blur=yes
selection-foreground=000000
selection-background=A4CDFF
cursor=FFFFFF 000000

regular0=000000
regular1=990000
regular2=28B81A
regular3=999900
regular4=3A1AAD
regular5=A825AF
regular6=00A6B2
regular7=4D4D4D

bright0=666666
bright1=E50000
bright2=00D900
bright3=E5E500
bright4=0000FF
bright5=E500E5
bright6=00E5E5
bright7=FFFFFF
