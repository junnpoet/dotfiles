# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT CTRL, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, M, Strawberry, exec, uwsm-app -- strawberry
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Notion, exec, notion-app

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, I, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com/app?hl=es"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Keybindings customizations
unbind = SUPER, K
bindd = SUPER, I, Show key bindings, exec, omarchy-menu-keybindings

# Tiling navigation customization (remapping from arrow keys)
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = SUPER, L
unbind = SUPER, J

# Enfoque a la Izquierda
bindd = SUPER, H, Focus left, movefocus, l
bind = SUPER, H, alterzorder, top

# Enfoque a la Derecha
bindd = SUPER, L, Focus right, movefocus, r
bind = SUPER, L, alterzorder, top

# Enfoque Arriba
bindd = SUPER, K, Focus up, movefocus, u
bind = SUPER, K, alterzorder, top

# Enfoque Abajo
bindd = SUPER, J, Focus down, movefocus, d
bind = SUPER, J, alterzorder, top

# Move layout toggle to SUPER+TAB, overriding existing TAB bindings
unbind = SUPER, TAB
bindd = SUPER, TAB, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle

# Toggle window split
bindd = SUPER, U, Toggle window split, layoutmsg, togglesplit

# Group navigation (focus)
unbind = SUPER CTRL, LEFT
unbind = SUPER CTRL, RIGHT
bindd = SUPER, N, Previous window in group, changegroupactive, b
bindd = SUPER, M, Next window in group, changegroupactive, f

# Group navigation (reorder)
bindd = SUPER ALT, N, Reorder window backward, movegroupwindow, b
bindd = SUPER ALT, M, Reorder window forward, movegroupwindow, f

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button
